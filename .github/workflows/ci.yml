name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  corpus-check:
    name: Corpus self-compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify corpus self-compliance
        run: node scripts/check_corpus.mjs

  build-site:
    name: Build docs site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build (sync + astro build)
        run: npm run build
